name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-aarch64
            os: macos-26
    defaults:
      run:
        working-directory: weft
    steps:
      - uses: actions/checkout@v7
        with:
          path: weft

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build
      - run: zig build test
      - if: startsWith(github.ref, 'refs/tags/')
        run: mv zig-out/bin/weft ../weft-${{ matrix.name }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: weft-${{ matrix.name }}
          path: weft-${{ matrix.name }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes
